name: Verification

on:
  push:
    branches: [main, 'codex/d5-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      LANGSMITH_TRACING: 'false'
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.12'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Run host tests (no generated code on host)
        run: uv run --frozen pytest -q -m 'not docker'
      - name: Verify config-driven offline intake
        run: uv run --frozen labweaver intake --offline --task '概览字段与缺失情况'
  docker:
    name: Ubuntu / real Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: 'false'
      LABWEAVER_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.12'
          python-version: '3.11'
      - run: uv sync --locked --python 3.11
      - name: Build locked analysis sandbox
        run: docker build -t labweaver-python:0.2.0 sandbox
      - name: Real container acceptance and isolation
        run: uv run --frozen pytest -q -m docker
      - name: Public survey example through both Agents
        run: uv run --frozen labweaver intake --offline --csv examples/data/survey.csv --task '统计部门满意度平均值并绘制柱状图'

