name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      LANGSMITH_TRACING: 'false'
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.12'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Run offline tests
        run: uv run --frozen pytest -q
      - name: Verify config-driven offline intake
        run: uv run --frozen labweaver intake --offline
      - name: Verify experimental-data intake overrides
        run: uv run --frozen labweaver intake --config examples/configs/experiments.toml
      - name: Verify D3 retrieval and brief artifacts
        run: uv run --frozen python verify_d3.py

