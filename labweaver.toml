# Shared by VS Code and the intake CLI. Paths are relative to this file.
[intake]
csv = "examples/data/survey.csv"
task_file = "examples/tasks/survey.txt"
mode = "live"
encoding = "utf-8-sig"
delimiter = ","
sample_rows = 5
output_dir = "runs"

# Model credentials default to .env beside this file, or LLM_* environment variables.
# Never put credentials in this TOML.
# Reference an existing .env via env_file in ignored labweaver.local.toml.
