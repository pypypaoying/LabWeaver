# Shared by VS Code and the intake CLI. Paths are relative to this file.
[intake]
csv = "examples/data/survey.csv"
task_file = "examples/tasks/survey_rag.txt"
mode = "live"
encoding = "auto"
delimiter = "auto"
sample_rows = 5
output_dir = "runs"
materials = [
    "examples/materials/survey/requirements.md",
    "examples/materials/survey/variables.txt",
    "examples/materials/survey/methods.pdf",
]

# Model credentials default to .env beside this file, or LLM_* environment variables.
# Never put credentials in this TOML.
# Reference an existing .env via env_file in ignored labweaver.local.toml.
# Python runs only in the locked Linux sandbox image (build once).
execution_image = "labweaver-python:0.2.0"
execution_timeout = 60
analysis_max_tokens = 4096
