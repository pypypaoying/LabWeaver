[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "labweaver"
version = "0.1.0"
description = "An evidence-based intake agent for student and research data projects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents>=0.7.20,<0.8",
    "langchain-openai>=1.6.6,<2",
    "python-dotenv>=1.1,<2",
    "pypdf>=6,<7",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
]

[project.scripts]
labweaver = "labweaver.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/labweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
cache-dir = ".cache/uv"

