[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "labweaver"
version = "0.2.0"
description = "A conversational data analysis assistant with isolated Python code agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents>=0.7.20,<0.8",
    "langchain-openai>=1.6.6,<2",
    "python-dotenv>=1.1,<2",
    "pypdf>=6,<7",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
    "charset-normalizer>=3.4,<4",
]

[project.scripts]
labweaver = "labweaver.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/labweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: real isolated Docker integration (requires prebuilt sandbox image)"]

[tool.uv]
cache-dir = ".cache/uv"

